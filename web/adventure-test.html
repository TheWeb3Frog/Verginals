<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Adventure Mode</title>
<link rel="icon" href="/favicon.svg">
<style>
  body {
    margin: 0;
    background: #0E0E13;
    color: #E6E4DC;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 24px; }
  h1 {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 3px;
  }
  .note { font-size: 11px; line-height: 1.7; color: #6E6F82; }
  #status { margin: 14px 0; font-size: 12px; line-height: 1.6; color: #A9AAB8; }
  #status[data-tone="ok"]  { color: #A8CC63; }
  #status[data-tone="bad"] { color: #FF9A2E; }
  button {
    padding: 10px 14px;
    font: 12px/1 ui-monospace, monospace;
    letter-spacing: 1px;
    background: #FFC93C;
    color: #0E0E13;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>ADVENTURE MODE</h1>
    <p class="note">
      Unfinished and unannounced. Descendants are wiped at the end of every season, and the rules
      will change under you while this is being tuned. Your Alphas are never touched.
    </p>
  </header>
  <p id="status">Loading.</p>
  <button id="connect" hidden>Connect wallet</button>
  <div id="app"></div>
</main>
<script type="module" src="/adventure-boot.js"></script>
</body>
</html>
